[project]
name = "backend"
version = "0.1.0"
description = "Marginalia backend API server"
readme = "README.md"
authors = [
    { name = "Oliver Normand", email = "oliver@normand.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "uvicorn>=0.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.2.1",
    "assemblyai>=0.48.4",
    "anthropic>=0.75.0",
    "boto3>=1.42.27",
    "PyJWT[crypto]>=2.8.0",
    "supabase>=2.0.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
